name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medcheckin
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: medcheckin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medcheckin -d medcheckin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgres://medcheckin:ci_only_not_a_secret@localhost:5432/medcheckin
      DATABASE_URL_TEST: postgres://medcheckin:ci_only_not_a_secret@localhost:5432/medcheckin_test
      # o link mágico é credencial: o envio por SMTP é testado de verdade (core/test/mailer.test.js)
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      EMAIL_FROM: MedCheck-in <nao-responda@medcheckin.test>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=ci_only_not_a_secret psql -h localhost -U medcheckin -d medcheckin -c 'create database medcheckin_test'
      - run: npm run check
      - name: npm audit (high+) com exceções datadas
        run: node scripts/audit-check.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - name: docker build (web + scheduler)
        run: |
          docker build -f apps/web/Dockerfile -t medcheckin-web:ci .
          docker build -f apps/scheduler/Dockerfile -t medcheckin-scheduler:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
